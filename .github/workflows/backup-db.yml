# Bazaning haftalik zaxira nusxasi (Supabase bepul tarifida yuklab olinadigan zaxira yoʻq).
# Nusxa shifrlanadi va shu ish (workflow run) sahifasiga "artifact" boʻlib 90 kunga saqlanadi.
# Repo ochiq boʻlgani uchun artifact'ni GitHub'ga kirgan har kim yuklab olishi mumkin — shuning uchun
# shifrlash majburiy: parolsiz fayl foydasiz. Tiklash tartibi: mutolaa-app/README.md → "Zaxira nusxa".
#
# Repo Settings → Secrets and variables → Actions ga qoʻshing:
#   SUPABASE_DB_URL    — Supabase → Connect → "Session pooler" manzili (IPv4; GitHub IPv6'siz ishlaydi):
#                        postgresql://postgres.<loyiha>:<baza paroli>@aws-…pooler.supabase.com:5432/postgres
#   BACKUP_PASSPHRASE  — shifrlash paroli, kamida 20 belgi. Yoʻqotilsa nusxalarni ochib boʻlmaydi —
#                        parol menejerida (yoki qogʻozda) saqlang.
# Ogohlantirish (ixtiyoriy): TELEGRAM_BOT_TOKEN, ALERT_TELEGRAM_CHAT_ID — natija Telegram'ga yoziladi.
name: Baza zaxirasi

on:
  schedule:
    - cron: "0 21 * * 0" # har yakshanba 21:00 UTC (dushanba 02:00 Toshkent) — haftalik importdan oldin
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Sozlamalarni tekshirish
        run: |
          [ -n "$SUPABASE_DB_URL" ] || { echo "::error::SUPABASE_DB_URL secret qoʻshilmagan"; exit 1; }
          [ "${#BACKUP_PASSPHRASE}" -ge 20 ] || { echo "::error::BACKUP_PASSPHRASE yoʻq yoki 20 belgidan qisqa"; exit 1; }
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}

      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0 # shu versiyada sinalgan; yangilaganda nusxa olish va tiklashni qayta sinang

      - name: Bazadan nusxa olish
        run: |
          mkdir backup
          # Supabase tavsiya qilgan uch qism: rollar, tuzilma, maʼlumot (auth.users ham shu yerda)
          supabase db dump --db-url "$SUPABASE_DB_URL" --role-only -f backup/roles.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" --data-only --use-copy -f backup/data.sql
          # Tiklashda schema.sql dan OLDIN ishga tushiriladi. Busiz yangi bazadagi "default privileges"
          # har bir jadval va funksiyani anon/authenticated ga toʻliq ochib yuboradi (migratsiyalardagi
          # revoke'lar nusxada saqlanmaydi). schema.sql oxirida standart holat qayta tiklanadi.
          cat > backup/pre-schema.sql <<'SQL'
          alter default privileges in schema public revoke all on tables from anon, authenticated, service_role;
          alter default privileges in schema public revoke all on sequences from anon, authenticated, service_role;
          alter default privileges in schema public revoke all on functions from anon, authenticated, service_role;
          SQL
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Nusxa toʻliqligini tekshirish
        run: |
          # Boʻsh yoki chala nusxa "muvaffaqiyatli" boʻlib koʻrinmasin
          for table in auth.users public.profiles public.books public.user_books; do
            pattern="^COPY \"?${table%.*}\"?\.\"?${table#*.}\"? "
            grep -Eq "$pattern" backup/data.sql || { echo "::error::data.sql ichida $table yoʻq"; exit 1; }
          done
          grep -Eqi 'create table (if not exists )?"?public"?\."?books"?' backup/schema.sql || { echo "::error::schema.sql ichida books jadvali yoʻq"; exit 1; }
          wc -c backup/*.sql

      - name: Shifrlash
        id: pack
        run: |
          name="xatchop-db-$(date -u +%Y-%m-%d)"
          tar -czf "$name.tar.gz" -C backup .
          gpg --batch --yes --pinentry-mode loopback --passphrase-file <(printf '%s' "$BACKUP_PASSPHRASE") \
            --symmetric --cipher-algo AES256 -o "$name.tar.gz.gpg" "$name.tar.gz"
          # Ochiq (shifrlanmagan) fayllar artifact'ga tushib qolmasin
          rm -rf backup "$name.tar.gz"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$name.tar.gz.gpg" | cut -f1)" >> "$GITHUB_OUTPUT"
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.name }}
          path: ${{ steps.pack.outputs.name }}.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error
          compression-level: 0

      - name: Telegram xabari
        if: ${{ !cancelled() }}
        run: |
          [ -n "$ALERT_TELEGRAM_CHAT_ID" ] && [ -n "$TELEGRAM_BOT_TOKEN" ] || exit 0
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$JOB_STATUS" = "success" ]; then
            text="💾 Baza zaxirasi olindi ($SIZE, shifrlangan, 90 kun saqlanadi): $run_url"
          else
            text="⚠️ $GITHUB_WORKFLOW yiqildi — bu hafta zaxira nusxa yoʻq: $run_url"
          fi
          curl -sS -o /dev/null -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$ALERT_TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$text"
        env:
          JOB_STATUS: ${{ job.status }}
          SIZE: ${{ steps.pack.outputs.size }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALERT_TELEGRAM_CHAT_ID: ${{ secrets.ALERT_TELEGRAM_CHAT_ID }}
