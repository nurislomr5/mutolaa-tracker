# Katalogni har hafta yangilaydi: Mutolaa (audio/e-kitob) va Asaxiy (qogʻoz kitoblar, narx, mavjudlik).
# Repo Settings → Secrets and variables → Actions ga qo'shing:
#   NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
name: Katalog importi

on:
  schedule:
    - cron: "0 2 * * 1" # har dushanba 02:00 UTC (07:00 Toshkent)
  workflow_dispatch:
    inputs:
      args:
        description: "Ikkala importer uchun qo'shimcha argumentlar (masalan: --force yoki --limit 50)"
        required: false
        default: ""

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: mutolaa-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mutolaa-app/package-lock.json
      - run: npm ci
      - name: Mutolaa
        run: npm run import:mutolaa -- $IMPORT_ARGS
        env:
          IMPORT_ARGS: ${{ inputs.args }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Asaxiy
        # Mutolaa muvaffaqiyatsiz boʻlsa ham Asaxiy yangilanaversin
        if: ${{ !cancelled() }}
        run: npm run import:asaxiy -- $IMPORT_ARGS
        env:
          IMPORT_ARGS: ${{ inputs.args }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
